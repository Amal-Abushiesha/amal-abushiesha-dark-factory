version: '3'

tasks:
  gate:
    desc: Run build, analysis, vulnerability, race, and coverage checks
    cmds:
      - go build ./...
      - go vet ./...
      - CGO_ENABLED=0 go tool golangci-lint run ./...
      - go tool staticcheck ./...
      - go tool govulncheck ./...
      - |
        set -eu
        go test -race -covermode=atomic -coverpkg=./... -coverprofile=coverage.out ./...
        go tool cover -func=coverage.out
        go tool cover -func=coverage.out | awk '/^total:/ { gsub("%", "", $3); if ($3 + 0 < 90) { printf "coverage %s%% is below 90%%\n", $3; failed = 1 } found = 1 } END { if (!found) { print "coverage total was not reported"; failed = 1 } exit failed }'
